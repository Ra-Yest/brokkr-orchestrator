# Example AFK Pipeline Configuration (pipeline.yaml)
# Demonstrates full decoupling of agent provider profiles from pipeline roles.
# Swap Master / Worker / Reviewer simply by changing `roles:` or `providers:`.

schema_version: 1

project:
  name: "example-app"
  pipeline_dir: ".pipeline"
  agents_file: "AGENTS.md"
  agent_roles_dir: ".agents"
  anti_laziness_file: ".agents/anti_laziness_openai.md"
  tasks_file: "tasks.json"
  repo_map_ignore:
    - ".git"
    - ".pipeline"
    - ".venv"
    - "venv"
    - "node_modules"
    - "__pycache__"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".ruff_cache"
    - "dist"
    - "app/build"
    - "android/build"
    - "web/build"
    - "**/build/outputs"
    - ".next"

providers:
  # Fast worker via Codex CLI (works with ChatGPT Plus OAuth OR OPENAI_API_KEY via optional `${VAR:-}`)
  provider_fast:
    kind: "cli"
    can_edit_files: true
    command: ["codex", "exec"]
    prompt_mode: "stdin"
    args_template: ["--full-auto", "--model", "{model}", "-o", "{output_file}", "-"]
    model: "gpt-5-codex-mini"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    output_parser: "plain"
    timeout_seconds: 900
    anti_laziness: true
    rate_limit_patterns:
      - '\b429\b'
      - 'rate[\s_-]*limit'
      - 'quota[\s_-]*exceeded'
      - 'too many requests'
      - 'usage limit reached'
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000
    quota_max_requests: 120

  # Main worker via Antigravity CLI (stdin prompt delivery, non-interactive write mode)
  provider_main:
    kind: "cli"
    can_edit_files: true
    command: ["agy"]
    prompt_mode: "stdin"
    args_template:
      - "--model"
      - "{model}"
      - "--dangerously-skip-permissions"
      - "--disable-slash-commands"
      - "--input-format"
      - "text"
      - "--output-format"
      - "text"
    model: "gemini-4-hydrogen-high"
    output_parser: "plain"
    timeout_seconds: 900
    # Recommended: 300s (safe with CPU-aware idle checking enabled in v0.2.2+)
    idle_timeout_seconds: 300
    idle_check_process_cpu: true
    # Optional per-provider override for stalled-agent stdout/stderr detection:
    # stall_stdout_patterns: ["waiting for \\d+ background task", "root agent idle; waiting for"]
    # stall_grace_seconds: 30
    anti_laziness: false
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000
    quota_max_requests: 80
    # Optional fallback provider profiles tried automatically on 429 / quota ceiling:
    fallback_providers: []
    # Optional sequential account switching (e.g., via `aisw`):
    # account_group: "agy"
    # account_profile: "cheap"
    # switch_command: ["aisw", "use", "antigravity", "cheap"]

  # Read-only pre-reviewer via Antigravity CLI (`--mode plan`, without `--disable-slash-commands`)
  provider_pre_reviewer_agy:
    kind: "cli"
    can_edit_files: false
    command: ["agy"]
    prompt_mode: "stdin"
    args_template:
      - "--model"
      - "{model}"
      - "--mode"
      - "plan"
      - "--input-format"
      - "text"
      - "--output-format"
      - "text"
    model: "gemini-4-neon-medium"
    output_parser: "plain"
    timeout_seconds: 600
    idle_timeout_seconds: 300
    anti_laziness: false
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000
    quota_max_requests: 80

  # Strong worker via abstract/custom CLI agent (e.g., Claude Code, Gemini CLI, Aider, or custom script)
  provider_strong:
    kind: "cli"
    can_edit_files: true
    command: ["claude", "-p"]
    prompt_mode: "stdin"
    args_template: ["--output-format", "json"]
    output_parser: "json_field"
    output_json_path: "result"
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    timeout_seconds: 900
    anti_laziness: false
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000

  # Master CLI profile (can edit files -> valid for architect, refactorer, worker_hard, AND read-only roles)
  provider_master:
    kind: "cli"
    can_edit_files: true
    command: ["codex", "exec"]
    prompt_mode: "stdin"
    args_template: ["--full-auto", "--model", "{model}", "-o", "{output_file}", "-"]
    model: "gpt-5-codex"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    output_parser: "plain"
    timeout_seconds: 900
    anti_laziness: true
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000
    quota_max_requests: 60

  # Read-only API provider example (can_edit_files defaults to false).
  # Valid ONLY for read-only roles: `planner`, `pre_reviewer`, `reviewer`.
  # Assigning it to `worker_*`, `architect`, or `refactorer` fails config validation.
  provider_reviewer_api:
    kind: "api"
    can_edit_files: false
    base_url: "https://api.openai.com/v1"
    api_key_env: "REVIEWER_API_KEY"
    model: "gpt-5"
    temperature: 0.1
    timeout_seconds: 300
    anti_laziness: false
    rate_limit_cooldown_seconds: 900
    quota_window_seconds: 18000

# Role-to-profile mapping (change Master or Worker without touching orchestrator code)
roles:
  planner: "provider_master"            # Can also use `provider_reviewer_api`
  worker_easy: "provider_fast"
  worker_medium: "provider_main"
  worker_hard: "provider_strong"
  pre_reviewer: "provider_pre_reviewer_agy"  # Can also use `provider_reviewer_api`
  reviewer: "provider_master"           # Can also use `provider_reviewer_api`
  architect: "provider_master"          # Must have can_edit_files: true
  refactorer: "provider_master"         # Must have can_edit_files: true

# Optional role-level fallback providers tried when primary profile hits 429 or quota_max_requests
fallback_providers: {}
# Example:
#   worker_medium: ["provider_strong", "provider_master"]
#   reviewer: ["provider_reviewer_api"]

zones:
  red_protected:
    - ".pipeline/**"
    - "pipeline.yaml"
    - ".env*"
    - "**/.env*"
    - ".agents/**"
    - "AGENTS.md"
    - "docs/specs/**"
  test_patterns:
    - "tests/**"
    - "**/tests/**"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/*.test.*"
    - "**/*.spec.*"
  yellow_shared:
    - "pyproject.toml"
    - "package.json"
    - "tsconfig.json"
    - "src/shared/**"
    - "src/db/**"
    - "src/router*"
    - "src/routes/**"
  enforce_allowed_paths_on_yellow: false

diff_guard:
  # New test files matching zones.test_patterns do not count against production max_files/max_lines
  # (Red Zone M/D/R, allowed_paths, and PlaceholderGuard still apply to tests).
  exclude_tests_from_limits: true
  hard_max_test_lines: 3000
  limits:
    easy:   { soft_max_files: 5,  soft_max_lines: 200,  hard_max_files: 8,  hard_max_lines: 400 }
    medium: { soft_max_files: 12, soft_max_lines: 600,  hard_max_files: 20, hard_max_lines: 1400 }
    hard:   { soft_max_files: 25, soft_max_lines: 1500, hard_max_files: 40, hard_max_lines: 2500 }
  architect_limit:  { soft_max_files: 15, soft_max_lines: 800,  hard_max_files: 25, hard_max_lines: 1500 }
  refactorer_limit: { soft_max_files: 30, soft_max_lines: 1800, hard_max_files: 45, hard_max_lines: 3000 }
  exclude_from_review:
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/poetry.lock"
    - "**/uv.lock"
    - "**/*.svg"
    - "**/*.png"
    - "**/*.jpg"
    - "dist/**"
    - "app/build/**"
    - "android/build/**"
    - "web/build/**"
    - "**/build/outputs/**"
    - "**/*.generated.*"
  # Service artifacts (e.g., background LSP files like go.work.sum) ignored & cleaned for read-only roles
  readonly_ignore_paths:
    - "go.work.sum"
    - "**/go.work.sum"
  # Companion lock files automatically allowed in the same directory when a task's allowed_paths permits the manifest
  paired_paths:
    "**/pubspec.yaml": ["**/pubspec.lock"]
    "**/go.mod": ["**/go.sum"]
    "**/package.json": ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock"]
    "**/Cargo.toml": ["**/Cargo.lock"]

placeholder_guard:
  enabled: true
  extra_patterns: []
  allow_in_paths: []

gates:
  - name: "lint"
    command: ["ruff", "check", "."]
    timeout_seconds: 120
    kind: "command"
    optional: false
  - name: "typecheck"
    command: ["mypy", "src"]
    timeout_seconds: 180
    kind: "command"
    optional: false
  - name: "unit_tests"
    command: ["pytest", "-q"]
    timeout_seconds: 300
    kind: "command"
    optional: false
  # Optional Playwright / UI gate (screenshots written to $ORCHESTRATOR_SCREENSHOTS_DIR)
  # - name: "ui_smoke"
  #   command: ["npx", "playwright", "test", "--grep", "@smoke"]
  #   timeout_seconds: 300
  #   kind: "playwright"
  #   optional: false

workflow:
  max_attempts: 6
  max_review_rounds: 3
  max_gate_retries_per_round: 3
  hard_split_after_rounds: 2
  batch_review_size: 3
  refactor_every_n_tasks: 6
  refactor_on_stage_complete: true
  cleanup_ports: []
  max_transport_retries: 6
  transport_retry_delays_seconds: [3, 5, 10, 20, 30]
  transport_failure_max_duration_seconds: 120
  transient_retry_delays_seconds: [10, 30, 90]
  retry_on_timeout_readonly: 1
  auto_commit: true
  commit_prefix: "feat"
  strict_clean_start: true
  # Review prompt diff trimming (applies strictly to pre_reviewer/reviewer prompts, NOT diff_guard/gates/commit)
  review_diff_exclude_patterns:
    - "*.lock"
    - "**/pubspec.lock"
    - "**/go.sum"
    - "**/go.work.sum"
    - "**/*_gen.go"
    - "**/*_gen.dart"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  review_diff_max_file_lines: 400
  review_diff_max_chars: 80000
  # Keep active silent CLI processes alive when process-tree CPU time increases
  idle_check_process_cpu: true
  # 503 / capacity errors -> short cooldown + immediate fallback without burning task.attempts
  capacity_error_patterns:
    - "503"
    - "UNAVAILABLE"
    - "No capacity available"
    - "overloaded"
    - "Service Unavailable"
  capacity_cooldown_seconds: 90
  # 502 / network errors -> free transport_retry with backoff, then fallback when retries exhaust
  transient_error_patterns:
    - "502"
    - "Bad Gateway"
    - "ECONNRESET"
    - "ETIMEDOUT"
    - "socket hang up"
  # Stalled-agent stdout/stderr detector (kills process tree if no exit or workspace edit within grace window)
  stall_stdout_patterns:
    - 'waiting for \d+ background task'
    - 'root agent idle; waiting for'
  stall_grace_seconds: 30
  # Context files prompt budget (prevents oversized context_files from blowing up prompt size)
  context_file_max_chars: 12000
  context_files_total_max_chars: 40000

notifications:
  telegram:
    enabled: false
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    timeout_seconds: 10
    notify_on_provider_started: false
    events:
      - "run_started"
      - "task_done"
      - "task_failed"
      - "escalation"
      - "pause"
      - "run_finished"
      - "fatal_error"

# Optional external proxy/gateway health monitor (disabled by default; fully declarative).
# Machine-specific paths/ports/patterns can live in a gitignored `*.local.yaml` file.
proxy_monitor:
  enabled: false
